name: Build & Publish ET BSP Desktop (.exe)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Electron, Builder & Auto-Updater
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund --save electron-updater
          npm install --legacy-peer-deps --no-audit --no-fund -D electron electron-builder

      - name: Bump build version for auto-update detection
        shell: bash
        run: |
          npm version "1.1.${GITHUB_RUN_NUMBER}" --no-git-tag-version

      - name: Build & Publish Windows Release (.exe + latest.yml)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx vite build
          npx electron-builder --config electron-builder.json --win --publish always -c.publish.provider=github -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }} -c.publish.releaseType=release

      - name: Verify generated files
        shell: bash
        run: ls -la release

      - name: Upload Windows .exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ET-BSP-Windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/latest.yml
