name: Build & Publish ET BSP Desktop (.exe)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Electron, Builder & Auto-Updater
        shell: bash
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund --save electron-updater
          npm install --legacy-peer-deps --no-audit --no-fund -D electron electron-builder

      - name: Bump build version and create release tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="1.1.${GITHUB_RUN_NUMBER}"
          npm version "$VERSION" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v${VERSION}"
          git push -f origin "v${VERSION}"
          gh release create "v${VERSION}" --draft --target "${GITHUB_SHA}" --title "ET BSP v${VERSION}" --notes "Automated Windows build for ET BSP v${VERSION}."

      - name: Build & Upload Windows Release (.exe + latest.yml)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("electron-builder.json", "utf8"));
            const [owner, repo] = (process.env.GITHUB_REPOSITORY || "").split("/");
            cfg.publish = [{ provider: "github", owner, repo, releaseType: "draft" }];
            fs.writeFileSync("electron-builder.ci.json", JSON.stringify(cfg, null, 2));
          '
          npx vite build
          npx electron-builder --config electron-builder.ci.json --win --publish always

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="1.1.${GITHUB_RUN_NUMBER}"
          gh release edit "v${VERSION}" --draft=false --latest

      - name: Verify generated files
        shell: bash
        run: ls -la release

      - name: Upload Windows .exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ET-BSP-Windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/latest.yml
